name: Release

# Publica o ZIP instalável ao criar uma tag "vX.Y.Z".
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(sed -n "s/.*PLUGIN_CUSTOMBRANDING_VERSION', '\([^']*\)'.*/\1/p" setup.php)
          [ "$TAG" = "$CODE" ] || { echo "Tag $TAG differs from setup.php version $CODE"; exit 1; }
      - name: Build
        run: |
          sudo apt-get install -y -qq gettext zip
          sh tools/build_release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/custombranding-*.zip
          generate_release_notes: true
